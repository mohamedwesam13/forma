<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
       <link rel="stylesheet" href="style.css">
       
</head>
<body>
    <aside class="col-12 col-lg-3 col-md-4">
    <div class="d-flex flex-column gap-5">

        <div>
            <h5 class="fw-bold fs-6 mb-4">Category</h5>

            <div class="d-flex flex-column gap-3">

                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           id="men">
                    <label class="form-check-label small"
                           for="men">
                        Men
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           id="women">
                    <label class="form-check-label small"
                           for="women">
                        Women
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           id="new">
                    <label class="form-check-label small"
                           for="new">
                        New Arrivals
                    </label>
                </div>
            </div>
        </div>


        <div>
            <h5 class="fw-bold fs-6 mb-4">Size</h5>

            <div class="d-flex gap-2">

                <button class="btn btn-dark btn-sm px-3">
                    S
                </button>

                <button class="btn btn-outline-secondary btn-sm px-3">
                    M
                </button>

                <button class="btn btn-outline-secondary btn-sm px-3">
                    L
                </button>

                <button class="btn btn-outline-secondary btn-sm px-3">
                    XL
                </button>

            </div>
        </div>



        <div>
            <h5 class="fw-bold fs-6 mb-4">Price</h5>

            <div class="d-flex flex-column gap-3">

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           name="price"
                           id="under">

                    <label class="form-check-label small"
                           for="under">
                        Under $50
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           name="price"
                           id="mid">

                    <label class="form-check-label small"
                           for="mid">
                        $50 - $100
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           name="price"
                           id="over">

                    <label class="form-check-label small"
                           for="over">
                        Over $100
                    </label>
                </div>

            </div>
        </div>

    </div>
</aside>
</body>
</html>
