<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forma</title>
  
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body class="bg-white">

    <section class="bg-light py-5">

        <div class="container py-5">

            <div class="bg-success-subtle rounded-4 p-4 p-md-5 shadow-sm">

                <div class="row align-items-center g-5">


                    

                    <div class="col-lg-6">

                        <h1 class="display-4 fw-bold text-uppercase">

                            GET IN TOUCH

                            <br>

                            <span class="fst-italic">
                                WITH FORMA
                            </span>

                        </h1>


                        <p class="text-secondary mt-4 mb-5">

                            Have a question about your order?
                            Need help choosing the right size?
                            Our team is here to help.

                        </p>

                        <div class="d-flex align-items-center gap-3 mb-4">

                            <i class="bi bi-geo-alt-fill fs-4"></i>

                            <div>

                                <h6 class="fw-bold mb-1">
                                    LOCATION
                                </h6>

                                <p class="text-secondary mb-0">
                                    Mansoura, Egypt
                                </p>

                            </div>

                        </div>



                        <!-- EMAIL -->

                        <div class="d-flex align-items-center gap-3 mb-4">

                            <i class="bi bi-envelope-fill fs-4"></i>

                            <div>

                                <h6 class="fw-bold mb-1">
                                    EMAIL
                                </h6>

                                <p class="text-secondary mb-0">
                                    support@goalgear.com
                                </p>

                            </div>

                        </div>



                        <!-- PHONE -->

                        <div class="d-flex align-items-center gap-3">

                            <i class="bi bi-telephone-fill fs-4"></i>

                            <div>

                                <h6 class="fw-bold mb-1">
                                    PHONE
                                </h6>

                                <p class="text-secondary mb-0">
                                    +20 100 000 0000
                                </p>

                            </div>

                        </div>

                    </div>


                    <div class="col-lg-6">

                        <div class="bg-white rounded-4 shadow-sm p-4 p-md-5">

                            <form>

                                <div class="mb-3">

                                    <input
                                        type="text"
                                        class="form-control form-control-lg rounded-pill"
                                        placeholder="Full Name">

                                </div>


                                <div class="mb-3">

                                    <input
                                        type="email"
                                        class="form-control form-control-lg rounded-pill"
                                        placeholder="Email Address">

                                </div>


                                <div class="mb-3">

                                    <input
                                        type="text"
                                        class="form-control form-control-lg rounded-pill"
                                        placeholder="Your Subject">

                                </div>

                                <div class="mb-3">

                                    <textarea
                                        class="form-control rounded-4"
                                        rows="5"
                                        placeholder="Your Messsage"> </textarea>

                                <div class="form-check mb-4">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="privacy">

                                    <label
                                        class="form-check-label text-secondary"
                                        for="privacy">

                                        I agree to the privacy policy.

                                    </label>

                                </div>


                                <button
                                    type="submit"
                                    class="btn btn-dark w-100 rounded-pill py-3 fw-bold">

                                    SEND MESSAGE

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section> 
    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
