<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background:
                linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)),
                url('https://i.pinimg.com/1200x/38/2b/6c/382b6cf8df6d174c9d227861e438e6fa.jpg')
                no-repeat center center fixed;

            background-size: cover;
            color: #ffffff;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
        }


        .login-card {
            border:1px solid #333;
            border-radius: 12px;

            padding: 40px;

            width: 100%;

            max-width :420px;
        }


        .form-control {
            background-color: transparent;

            border: 1px solid #555;

            color: #fff;

            padding: 12px;

            border-radius: 6px;
        }


        .form-control:focus {
            background-color: transparent;

            color: #fff;

            border-color: #28a745;

            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
        }


        .form-control::placeholder {
            color: #aaa;
        }


        .btn-custom {
            background-color: #28a745;

            border: none;

            color: #fff;

            padding: 12px;

            font-weight: bold;

            letter-spacing: 1px;

            border-radius: 6px;

            transition: background 0.3s ease;
        }


        .btn-custom:hover {
            background-color: #218838;
            color: #fff;
        }


        .forgot-link,
        .register-link {
            color: #28a745;
            text-decoration: none;
        }


        .forgot-link:hover,
        .register-link:hover {
            text-decoration: underline;
        }


        /* رسالة JavaScript */
        #message {
            display: none;
            margin-bottom: 15px;
        }

    </style>

</head>


<body>

    <div class="login-card text-center">

        <h2 class="fw-bold mb-1">LOGIN</h2>

        <p class="text-secondary mb-4">
            Welcome back!
        </p>


        <!-- Login Form -->

        <form id="loginForm">

            <div class="mb-3 text-start">

                <label class="form-label text-light">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                >

            </div>


            <div class="mb-2 text-start">

                <label class="form-label text-light">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                >

            </div>


            <div class="text-end mb-4">

                <a href="#" class="forgot-link small">
                    Forgot password?
                </a>

            </div>


            <!-- JavaScript Message -->

            <div id="message" class="alert"></div>


            <button
                type="submit"
                class="btn btn-custom w-100 mb-4">
                LOGIN
            </button>


            <div class="text-center">

                <span class="text-secondary">
                    Don't have an account?
                </span>

                <br>
                <a
                    href="register.html"
                    class="register-link fw-bold mt-1 d-inline-block">
                    Register
                </a>

            </div>

        </form>

    </div>


    <!-- JavaScript -->

    <script>

        // Get elements from HTML

        const form = document.getElementById("loginForm");

        const email = document.getElementById("email");

        const password = document.getElementById("password");

        const message = document.getElementById("message");


        // When the user submits the form

        form.addEventListener("submit", function(event) {

            // Prevent page refresh

            event.preventDefault();


            // Get input values

            const emailValue = email.value.trim();

            const passwordValue = password.value.trim();


            // Check if inputs are empty

            if (emailValue === "" || passwordValue === "") {

                message.style.display = "block";

                message.className = "alert alert-danger";

                message.textContent =
                    "Please enter your email and password.";

            }


            // Check email format

            else if (!emailValue.includes("@")) {

                message.style.display = "block";

                message.className = "alert alert-danger";

                message.textContent =
                    "Please enter a valid email.";

            }


            // Login successful

            else {

                message.style.display = "block";

                message.className = "alert alert-success";

                message.textContent =
                    "Login successful!";

            }

        });

    </script>

</body>

</html>
