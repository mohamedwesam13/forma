<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FORMA STORE - Cart</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="cart-page">

        <!-- Page Title -->
        <h1 class="cart-title">YOUR CART</h1>


        <!-- Cart Products -->
        <section class="cart-container">

            <!-- Cart Header -->
            <div class="cart-header">

                <span>PRODUCT</span>
                <span>PRICE</span>
                <span>QUANTITY</span>
                <span>TOTAL</span>
                <span></span>

            </div>


            <!-- Product 1 -->
            <div class="cart-item">

                <div class="product-info">

                    <img src="assets/images.jpg" alt="Football Jersey">

                    <div>
                        <h3>Nike Dri-FIT Jersey</h3>

                        <p>Size: L</p>
                        <p>Color: Red</p>
                    </div>

                </div>


                <div class="product-price">
                    $54.99
                </div>


                <div class="quantity">

                    <button class="minus">−</button>

                    <span>2</span>

                    <button class="plus">+</button>

                </div>


                <div class="product-total">
                    $109.98
                </div>


                <button class="delete-btn">🗑</button>

            </div>


            <!-- Product 2 -->
            <div class="cart-item">

                <div class="product-info">

                    <img src="assets/paris-2024-olympics-soccer.jpg" alt="Football">

                    <div>
                        <h3>Adidas Al Rihla Ball</h3>

                        <p>Size: 5</p>
                    </div>

                </div>


                <div class="product-price">
                    $29.99
                </div>


                <div class="quantity">

                    <button class="minus">−</button>

                    <span>1</span>

                    <button class="plus">+</button>

                </div>


                <div class="product-total">
                    $29.99
                </div>


                <button class="delete-btn">🗑</button>

            </div>


            <!-- Product 3 -->
            <div class="cart-item">

                <div class="product-info">

                    <img src="assets/images (1).jpg" alt="Football Gloves">

                    <div>
                        <h3>Nike GK Gloves</h3>

                        <p>Size: L</p>
                        <p>Color: Black</p>
                    </div>

                </div>


                <div class="product-price">
                    $34.99
                </div>


                <div class="quantity">

                    <button class="minus">−</button>

                    <span>1</span>

                    <button class="plus">+</button>

                </div>


                <div class="product-total">
                    $34.99
                </div>


                <button class="delete-btn">🗑</button>

            </div>

        </section>


        <!-- Bottom Section -->
        <section class="cart-bottom">


            <!-- Coupon -->
            <div class="coupon-box">

                <h3>COUPON CODE</h3>

                <div class="coupon-form">

                    <input
                        type="text"
                        placeholder="Enter coupon code"
                    >

                    <button>APPLY</button>

                </div>

            </div>


            <!-- Summary -->
            <div class="summary">

                <div class="summary-row">

                    <span>SUBTOTAL</span>

                    <strong>$174.96</strong>

                </div>


                <div class="summary-row">

                    <span>SHIPPING</span>

                    <strong>$10.00</strong>

                </div>


                <div class="summary-total">

                    <span>TOTAL</span>

                    <strong>$184.96</strong>

                </div>


                <button class="checkout-btn">
                    PROCEED TO CHECKOUT
                </button>


                <a href="#" class="continue-shopping">
                    ‹ &nbsp; CONTINUE SHOPPING
                </a>

            </div>

        </section>

    </main>

</body>

</html>
