<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background:
                linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)),
                url('https://i.pinimg.com/1200x/38/2b/6c/382b6cf8df6d174c9d227861e438e6fa.jpg')
                no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .register-card {
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .form-control {
            background-color: transparent;
            border: 1px solid #555;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
        }

        .form-control:focus {
            background-color: transparent;
            color: #fff;
            border-color: #28a745;
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .btn-custom {
            background-color: #28a745;
            border: none;
            color: #fff;
            padding: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #218838;
            color: #fff;
        }

        .login-link {
            color: #28a745;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        #message {
            display: none;
            margin-bottom: 15px;
        }

        /* Footer CSS */
        .footer {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            padding: 40px 20px 20px;
            font-family: Arial, sans-serif;
            text-align: center;
            border-top: 1px solid #222222;
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-brand h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .footer-brand p {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin: 0;
        }

        .footer-section h3 {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .footer-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .footer-section a {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .footer-section a:hover {
            color: #28a745;
        }

        .bottom {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #1a1a1a;
        }

        .bottom p {
            color: #666666;
            font-size: 0.8rem;
            margin: 0;
        }

        @media (min-width: 768px) {
            .footer-content {
                flex-direction: row;
                justify-content: space-around;
                align-items: flex-start;
                text-align: left;
            }
            .footer-brand {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <div class="register-card text-center my-4">
        <h2 class="fw-bold mb-1">SIGN UP</h2>
        <p class="text-secondary mb-4">Create your account!</p>

        <form id="registerForm">
            <div class="mb-3 text-start">
                <label class="form-label text-light">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Enter your full name">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label text-light">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label text-light">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label text-light">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password">
            </div>

            <div id="message" class="alert"></div>

            <button type="submit" class="btn btn-custom w-100 mb-4">REGISTER</button>

            <div class="text-center">
                <span class="text-secondary">Already have an account?</span>
                <br>
                <a href="login.html" class="login-link fw-bold mt-1 d-inline-block">Login</a>
            </div>
        </form>
    </div>

    <!-- Start Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <h2>Forma Store</h2>
                <p>Quality fashion for everyone.</p>
            </div>
            <div class="footer-section">
                <h3>SHOP</h3>
                <a href="#">Men</a>
                <a href="#">Women</a>
                <a href="index.html#newarrivals">New Arrivals</a>
                <a href="#">Sale</a>
            </div>
            <div class="footer-section"> 
                <h3>HELP</h3>
                <a href="contactus.html">Contact Us</a>
                <a href="#">Shipping</a>
                <a href="#">Returns</a>
            </div>
            <div class="footer-section">
                <h3>FOLLOW US</h3>
                <a href="#">Instagram</a>
                <a href="#">Facebook</a> 
                <a href="#">TikTok</a>
            </div>
        </div>
        <div class="bottom">
            <p>© 2026 Forma Store. All Rights Reserved.</p>
        </div>
    </footer>
    <!-- End Footer -->

    <script>
    const form = document.getElementById("registerForm");
    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        
        const nameValue = fullName.value.trim();
        const emailValue = email.value.trim();
        const passwordValue = password.value.trim();
        const confirmPasswordValue = confirmPassword.value.trim();

        if (
            nameValue === "" ||
            emailValue === "" || 
            passwordValue === "" ||
            confirmPasswordValue === ""
        ) {
            message.style.display = "block";
            message.className = "alert alert-danger";
            message.textContent = "Please fill in all fields.";
        }
        else if (!emailValue.includes("@")) {
            message.style.display = "block";
            message.className = "alert alert-danger";
            message.textContent = "Please enter a valid email.";
        }
        else if (passwordValue.length < 6) {
            message.style.display = "block";
            message.className = "alert alert-danger";
            message.textContent = "Password must be at least 6 characters.";
        }
        else if (passwordValue !== confirmPasswordValue) {
            message.style.display = "block";
            message.className = "alert alert-danger";
            message.textContent = "Passwords do not match.";
        }
        else {
            const user = {
                fullName: nameValue,
                email: emailValue,
                password: passwordValue
            };

            localStorage.setItem("user", JSON.stringify(user)); 

            message.style.display = "block";
            message.className = "alert alert-success";
            message.textContent = "Account created successfully!";

            setTimeout(function(){
                window.location.href="index.html"; 
            }, 1500);
        }
    });
    </script>
</body>
</html>
